name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-and-unit:
    name: Qualidade Estática, Testes Unitários e Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Prisma validate & generate
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/loja_roupas_ci"
        run: |
          npx prisma validate
          npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Build verification
        env:
          NEXT_PUBLIC_APP_URL: "http://localhost:3000"
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/loja_roupas_ci"
        run: npm run build

  integration:
    name: Testes de Integração e Concorrência (PostgreSQL 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: loja_roupas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate & migrate deploy
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/loja_roupas_test"
        run: |
          npx prisma generate
          npx prisma migrate deploy

      - name: Integration tests
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/loja_roupas_test"
          RUN_INTEGRATION_TESTS: "true"
        run: npm run test:integration
